message=this
server.port=8090

eureka.instance.prefer-ip-address=true
eureka.client.registerWithEureka=true
eureka.client.fetchRegistry=true
eureka.client.serviceUrl.defaultZone=http://localhost:8761/eureka/,http://localhost:8762/eureka/,http://localhost:8763/eureka/
eureka.client.refresh.enable=false

management.endpoints.web.exposure.include=health,refresh
spring.jpa.hibernate.ddl-auto=validate
spring.datasource.url=jdbc:postgresql://127.0.0.1:5432/distribuidos3
spring.datasource.username=postgres
spring.datasource.password=

# Circuit Breaker independente para operacoes de leitura.
resilience4j.circuitbreaker.instances.funcionarios-leitura.slidingWindowType=COUNT_BASED
resilience4j.circuitbreaker.instances.funcionarios-leitura.slidingWindowSize=20
resilience4j.circuitbreaker.instances.funcionarios-leitura.minimumNumberOfCalls=20
resilience4j.circuitbreaker.instances.funcionarios-leitura.permittedNumberOfCallsInHalfOpenState=5
resilience4j.circuitbreaker.instances.funcionarios-leitura.failureRateThreshold=50
resilience4j.circuitbreaker.instances.funcionarios-leitura.waitDurationInOpenState=15s
resilience4j.circuitbreaker.instances.funcionarios-leitura.ignoreExceptions[0]=org.springframework.web.server.ResponseStatusException
resilience4j.circuitbreaker.instances.funcionarios-leitura.ignoreExceptions[1]=org.springframework.dao.DataIntegrityViolationException


# Circuit Breaker independente para operacoes de escrita.
resilience4j.circuitbreaker.instances.funcionarios-escrita.slidingWindowType=COUNT_BASED
resilience4j.circuitbreaker.instances.funcionarios-escrita.slidingWindowSize=20
resilience4j.circuitbreaker.instances.funcionarios-escrita.minimumNumberOfCalls=20
resilience4j.circuitbreaker.instances.funcionarios-escrita.permittedNumberOfCallsInHalfOpenState=5
resilience4j.circuitbreaker.instances.funcionarios-escrita.failureRateThreshold=50
resilience4j.circuitbreaker.instances.funcionarios-escrita.waitDurationInOpenState=15s
resilience4j.circuitbreaker.instances.funcionarios-escrita.ignoreExceptions[0]=org.springframework.web.server.ResponseStatusException
resilience4j.circuitbreaker.instances.funcionarios-escrita.ignoreExceptions[1]=org.springframework.dao.DataIntegrityViolationException
