apiVersion: apps/v1
kind: Deployment
metadata:
  name: service-alpha
  namespace: distribuidos3-lab
spec:
  replicas: 1
  selector:
    matchLabels:
      app: service-alpha
  template:
    metadata:
      labels:
        app: service-alpha
    spec:
      volumes:
        - name: bootstrap
          configMap:
            name: config-client-bootstrap
      initContainers:
        - name: aguardar-dependencias
          image: busybox:1.37
          command:
            - sh
            - -ec
            - |
              for destino in config-server:8888 discovery-1:8761 discovery-2:8762 discovery-3:8763 postgres:5432; do
                host=${destino%:*}
                porta=${destino##*:}
                echo "Aguardando $host:$porta"
                until nc -z -w 2 "$host" "$porta"; do sleep 2; done
              done
          resources:
            requests:
              cpu: 10m
              memory: 8Mi
            limits:
              cpu: 100m
              memory: 32Mi
      containers:
        - name: service-alpha
          image: distribuidos3-alpha:build-20261105-050804-23fc52c8
          imagePullPolicy: IfNotPresent
          volumeMounts:
            - name: bootstrap
              mountPath: /config
              readOnly: true
          ports:
            - name: http
              containerPort: 8090
          env:
            - name: APPLICATION_NAME
              value: service-alpha
            - name: SPRING_CONFIG_LOCATION
              value: file:/config/application.properties
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: SPRING_APPLICATION_JSON
              value: '{"eureka.client.serviceUrl.defaultZone":"http://discovery-1:8761/eureka/,http://discovery-2:8762/eureka/,http://discovery-3:8763/eureka/","eureka.instance.prefer-ip-address":true,"eureka.instance.ip-address":"$(POD_IP)","eureka.instance.instance-id":"service-alpha:$(POD_IP):8090","server.port":8090,"spring.datasource.url":"jdbc:postgresql://postgres:5432/distribuidos3","spring.datasource.username":"postgres","spring.datasource.password":""}'
            - name: MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE
              value: "health,refresh,prometheus"
            - name: MANAGEMENT_METRICS_TAGS_APPLICATION
              value: "$(APPLICATION_NAME)"
            - name: MANAGEMENT_ENDPOINT_HEALTH_PROBES_ENABLED
              value: "true"
            - name: MANAGEMENT_ENDPOINT_HEALTH_GROUP_READINESS_INCLUDE
              value: "readinessState,db"
            - name: JAVA_TOOL_OPTIONS
              value: "-XX:MaxRAMPercentage=65.0"
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 768Mi
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            periodSeconds: 5
            timeoutSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
---
apiVersion: v1
kind: Service
metadata:
  name: service-alpha
  namespace: distribuidos3-lab
spec:
  selector:
    app: service-alpha
  ports:
    - name: http
      port: 8090
      targetPort: 8090
