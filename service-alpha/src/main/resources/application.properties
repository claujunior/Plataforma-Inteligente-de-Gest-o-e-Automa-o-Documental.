spring.application.name=service-alpha
server.port= 8090
spring.cloud.loadbalancer.ribbon.enabled = false
eureka.instance.preferIpAddress = true
eureka.client.registerWithEureka = true
eureka.client.fetchRegistry = true
eureka.client.serviceUrl.defaultZone=http://localhost:8761/eureka/,http://localhost:8762/eureka/,http://localhost:8763/eureka/
spring.config.import=optional:configserver:http://localhost:8888
management.endpoints.web.exposure.include=health,refresh
eureka.client.refresh.enable=false